# .pre-commit-config.yaml
# See https://pre-commit.com

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-merge-conflict
      # A committed .env is the mistake this template exists to stop repeating.
      - id: detect-private-key

  # ruff and mypy run from the project venv (`uv run`), so their versions come
  # from uv.lock — the same ones `make lint` and CI use. Separately pinned hook
  # repos drifted (ruff 0.8 here vs 0.16 in the lock) and disagreed on noqa.
  # --force-exclude: pre-commit passes filenames explicitly, which would
  # otherwise bypass extend-exclude (templates/ must stay unsorted).
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: uv run ruff check --fix --force-exclude
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff-format
        entry: uv run ruff format --force-exclude
        language: system
        types_or: [python, pyi]
      - id: mypy
        name: mypy
        # Whole targets, not just the staged files: mypy needs the full
        # import graph to judge a change.
        entry: uv run mypy app manage.py
        language: system
        types: [python]
        pass_filenames: false
