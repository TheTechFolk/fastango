# No `version:` key — it has been obsolete since Compose v2 and only produces
# a warning on every command.

services:
  # ── FastAPI Application ────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    command: >
      uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
      --proxy-headers --forwarded-allow-ips "*"
    volumes:
      # Source only. Mounting the repo root would shadow /app/.venv with the
      # host's, which is built for a different platform.
      - ./app:/app/app
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/fastango_db
      REDIS_URL: redis://redis:6379/0
    env_file:
      - local.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── PostgreSQL ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: fastango_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # Bound to loopback. "5432:5432" publishes the database on every
      # interface, which on a laptop on any shared network means the internet.
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Redis ──────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
  redis_data:
