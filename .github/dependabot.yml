# Weekly update PRs. pyproject.toml carries lower bounds only, so uv.lock is the
# pin and this is what moves it — the CI audit job fails if it falls behind.
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
